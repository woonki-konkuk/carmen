<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>카르멘 산디에고 — 파리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <div id="screen">
    <canvas id="view" width="480" height="270"></canvas>
    <div id="prompt" class="hidden"></div>
    <div id="status"><div id="money"></div><div id="heat"></div></div>
    <div id="chase" class="hidden"></div>
    <div id="banner" class="hidden"></div>
    <div id="aim" class="hidden"></div>
    <div id="hurt"></div>
    <div id="cafe" class="panel hidden"></div>
    <div id="pick" class="panel hidden"></div>
    <div id="brawl" class="panel hidden"></div>
    <div id="notice" class="panel hidden"></div>
    <div id="cutin" class="panel hidden"></div>
    <div id="toast" class="hidden"></div>
    <button id="phone-button"></button>
    <div id="phone"></div>
    <div id="curtain"></div>
    <div id="ending" class="panel hidden"></div>
    <div id="jail" class="panel hidden"></div>
    <div id="flashback" class="panel hidden"></div>
    <div id="title" class="panel hidden"></div>
    <div id="pad"></div>
  </div>
  <div id="rotate"><b>↻</b>휴대폰을 가로로 돌려 주세요</div>
  <div id="hint">화면을 클릭하거나 누른 채 끌면 둘러봅니다 · WASD 걷기 · ← → 돌기 · Shift 뛰기 · E 소매치기 · Tab 휴대폰</div>
</div>
<script src="js/core/util.js"></script>
